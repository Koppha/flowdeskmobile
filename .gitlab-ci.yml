# FlowDesk mobile - GitLab CI/CD
#
# Runs on the "flowdesk build runner" (shell executor on dt-devops-1,
# 10.3.10.48), which has Node 22, JDK 17 and the Android SDK in
# /opt/android-sdk.
#
# - Every push / merge request: typecheck + lint.
# - Tag vX.Y.Z (e.g. `git tag v1.0.1 && git push origin v1.0.1`):
#   build the release APK, keep it as a pipeline artifact, and upload it to
#   the FlowDesk portal ("Get the App" then serves it).
# - On main, a manual "build_apk" button builds a test APK without uploading.
# - On main, a manual "publish_update" button ships the current JS to every
#   installed APK of the latest release over the air (no new APK). Only for
#   JS-only changes: if native code changed since the last v* tag, the update
#   matches no installed APK - tag a new release instead.
# - PROD: the same tag pipeline has a manual "release_prod" button. One click
#   builds the production app (APP_ENV=prod: "FlowDesk", ls.co.etl.flowdesk,
#   the prod links), signs it with FlowDesk's release key, checks the
#   signature, and uploads it to PROD's "Get the App". Test the tag on UAT
#   first, then press it.
#
# CI/CD variables to set in GitLab (Settings > CI/CD > Variables, masked +
# protected): FLOWDESK_ADMIN_EMAIL, FLOWDESK_ADMIN_PASSWORD (an ADMIN account;
# the same login works on UAT and PROD). For release_prod also:
#   FLOWDESK_PROD_KEYSTORE_BASE64   keystores/flowdesk-release.keystore, base64
#   FLOWDESK_PROD_KEYSTORE_PASSWORD, FLOWDESK_PROD_KEY_PASSWORD
#                                   from keystores/release-signing.properties
#   FLOWDESK_PROD_API_URL (optional) default http://10.3.10.49:4000 (PROD1;
#                                   either PROD server works, builds are shared)
# They're PROD-only names on purpose: UAT builds must not pick up the release
# key (UAT phones have APKs signed with the debug key).

stages:
  - check
  - build
  - publish

variables:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk
  # The runner shares the GitLab server: cap Gradle so a build can't starve GitLab.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx3g"
  NODE_OPTIONS: "--max-old-space-size=2048"
  # dt-devops-1 runs Datadog single-step APM, which preloads an agent into
  # every JVM (/etc/ld.so.preload). Its startup warning goes to stderr, and the
  # Android Gradle Plugin's CMake/prefab step fails on any stderr output.
  # This is Datadog's documented per-process opt-out.
  DD_INSTRUMENT_SERVICE_WITH_APM: "false"
  # The runner is on the internal network, so upload straight to the UAT
  # backend instead of through the proxies (whose body-size limits are lower
  # than the ~80 MB APK).
  FLOWDESK_API_URL: "http://10.3.10.59:4000"

default:
  # The shared runner on dt-devops-1 only picks up jobs tagged "build"
  # (run_untagged = false), same as the backend project's jobs.
  tags:
    - build
  before_script:
    # Belt and braces with DD_INSTRUMENT_SERVICE_WITH_APM above.
    - unset JAVA_TOOL_OPTIONS

.release_tag: &release_tag
  if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

check:
  stage: check
  script:
    - npm ci --no-audit --no-fund
    - npx tsc --noEmit
    - npx expo lint
    # Bundle the JS like a release build does - catches bundler-only errors
    # (e.g. SDK 56 rejecting @react-navigation imports) before a tag is cut.
    - npx expo export --platform android --output-dir /tmp/flowdesk-export-$CI_JOB_ID && rm -rf /tmp/flowdesk-export-$CI_JOB_ID

build_apk:
  stage: build
  rules:
    - *release_tag
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  script:
    - npm ci --no-audit --no-fund
    - if [ -n "$CI_COMMIT_TAG" ]; then node scripts/set-version.mjs "${CI_COMMIT_TAG#v}"; fi
    - export APP_VERSION=$(node -p "require('./app.json').expo.version")
    - CI=1 npx expo prebuild --platform android --clean --no-install
    # One command (not "cd android && ... && cd ..") so a Gradle failure stops the job here.
    - ./android/gradlew -p android app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
    - cp android/app/build/outputs/apk/release/app-release.apk "flowdesk-mobile-${APP_VERSION}.apk"
    # The runtime version OTA updates must match to reach this APK (see publish_update).
    - echo "Runtime version:" && npx expo-updates runtimeversion:resolve --platform android | tail -1 | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).runtimeVersion"
    - echo "APP_VERSION=${APP_VERSION}" > build.env
  artifacts:
    name: "flowdesk-mobile-$CI_COMMIT_REF_NAME"
    paths:
      - flowdesk-mobile-*.apk
    reports:
      dotenv: build.env
    expire_in: 30 days

publish_apk:
  stage: publish
  needs: [build_apk]
  rules:
    - *release_tag
  script:
    - node scripts/upload-build.mjs --file "flowdesk-mobile-${APP_VERSION}.apk" --version "${APP_VERSION}"

# ── PROD ─────────────────────────────────────────────────────────────────
# One manual button on a release tag: build + sign + upload to PROD. One job
# (not build then publish) so pressing it does the whole release.
release_prod:
  stage: publish
  needs: [check]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: true
  variables:
    APP_ENV: prod
    # SHA-256 of FlowDesk's release certificate (public - it's in every APK).
    # The job refuses to upload an APK signed with anything else.
    FLOWDESK_RELEASE_CERT_SHA256: "840c67482bd4c2f30e54175c3cf177bb9222f1153e5754d18f28261e70c629ff"
  script:
    - |
      for v in FLOWDESK_PROD_KEYSTORE_BASE64 FLOWDESK_PROD_KEYSTORE_PASSWORD FLOWDESK_PROD_KEY_PASSWORD FLOWDESK_ADMIN_EMAIL FLOWDESK_ADMIN_PASSWORD; do
        if [ -z "$(printenv "$v")" ]; then echo "CI/CD variable $v is not set (see the top of .gitlab-ci.yml)"; exit 1; fi
      done
    # The release key, only for this job: decoded to a private temp file.
    - export FLOWDESK_KEYSTORE="$(mktemp /tmp/flowdesk-release-XXXXXX.keystore)"
    - printf '%s' "$FLOWDESK_PROD_KEYSTORE_BASE64" | base64 -d > "$FLOWDESK_KEYSTORE"
    - export FLOWDESK_KEYSTORE_PASSWORD="$FLOWDESK_PROD_KEYSTORE_PASSWORD" FLOWDESK_KEY_ALIAS=flowdesk FLOWDESK_KEY_PASSWORD="$FLOWDESK_PROD_KEY_PASSWORD"
    - npm ci --no-audit --no-fund
    - node scripts/set-version.mjs "${CI_COMMIT_TAG#v}"
    - export APP_VERSION=$(node -p "require('./app.json').expo.version")
    - CI=1 npx expo prebuild --platform android --clean --no-install
    - ./android/gradlew -p android app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
    - cp android/app/build/outputs/apk/release/app-release.apk "flowdesk-prod-${APP_VERSION}.apk"
    # Signed with the release key? (A phone can't update an APK signed with a different key.)
    - APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
    - |
      SIGNED_BY=$("$APKSIGNER" verify --print-certs "flowdesk-prod-${APP_VERSION}.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
    - echo "Signed by ${SIGNED_BY}"
    - test "$SIGNED_BY" = "$FLOWDESK_RELEASE_CERT_SHA256" || { echo "Not signed with FlowDesk's release key - not uploading."; exit 1; }
    - echo "Runtime version:" && npx expo-updates runtimeversion:resolve --platform android | tail -1 | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).runtimeVersion"
    # Straight to a PROD backend on the internal network (the proxies' body
    # limits are lower than the APK). upload-build.mjs refuses a UAT address.
    - export FLOWDESK_API_URL="${FLOWDESK_PROD_API_URL:-http://10.3.10.49:4000}"
    - node scripts/upload-build.mjs --file "flowdesk-prod-${APP_VERSION}.apk" --version "${APP_VERSION}"
  after_script:
    - rm -f /tmp/flowdesk-release-*.keystore
  artifacts:
    name: "flowdesk-prod-$CI_COMMIT_REF_NAME"
    paths:
      - flowdesk-prod-*.apk
    expire_in: 90 days

publish_update:
  stage: publish
  needs: [check]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  variables:
    # Full history + tags, to find the latest release tag.
    GIT_DEPTH: "0"
  script:
    - npm ci --no-audit --no-fund
    # Rebuild app.json exactly as the latest release APK was built, so the
    # runtime version (native fingerprint) matches the APKs people have installed.
    - LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')
    - echo "Targeting installed APKs of ${LATEST_TAG}"
    - node scripts/set-version.mjs "${LATEST_TAG#v}"
    - node scripts/publish-update.mjs --message "${CI_COMMIT_SHORT_SHA} ${CI_COMMIT_TITLE}"
